<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics Dojo Screen Control</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>ROBOTICS DOJO</h1>
    </header>

    <main>
        <div class="stream-section">
            <img id="live-stream" src="http://100.76.206.127:8080/stream" alt="Live screen feed">
        </div>

        <div class="controls-section">
            <div class="control-group">
                <h2>Display Category</h2>
                <div class="btn-container">
                    <button class="btn-class" onclick="sendClassCommand('organic')">Organic</button>
                    <button class="btn-class" onclick="sendClassCommand('other')">Other</button>
                    <button class="btn-class" onclick="sendClassCommand('plastic')">Plastic</button>
                </div>
            </div>

            <div class="control-group">
                <h2>System Controls</h2>
                <div class="btn-container">
                    <button class="btn-show" onclick="sendDisplayCommand(true)">Display Sample</button>
                    <button class="btn-hide" onclick="sendDisplayCommand(false)">Revert to Logo</button>
                </div>
            </div>
        </div>

        <div id="status">Status: Ready</div>
    </main>

    <footer>
        <p>Innovation at its finest</p>
    </footer>

    <script src="/static/script.js"></script>
</body>
</html>
