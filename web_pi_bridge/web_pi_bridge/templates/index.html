<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Screen Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            gap: 32px;
            padding: 24px;
        }
        h1 { margin-bottom: 0; }
        h2 { margin: 0; font-size: 16px; color: #aaa; font-weight: normal; }
        .section { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .btn-container { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        button {
            padding: 16px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        button:active { transform: scale(0.95); }
        .btn-show { background-color: #f1c40f; color: #000; }
        .btn-hide { background-color: #e74c3c; color: #fff; }
        .btn-class { background-color: #2ecc71; color: #000; }
        #status { margin-top: 8px; font-size: 16px; color: #888; text-align: center; }
    </style>
</head>
<body>
    <h1>Pi Framebuffer Display Control</h1>
    <div class="section">
        <h2>Live screen</h2>
        <img id="live-stream" src="http://100.76.206.127:8080/stream"
            style="max-width:90vw;border:2px solid #333;border-radius:8px;"
            alt="Live screen feed"
            onerror="this.style.opacity=0.3;" onload="this.style.opacity=1;">
    </div>

    <div class="section">
        <h2>Show random image from category</h2>
        <div class="btn-container">
            <button class="btn-class" onclick="sendClassCommand('organic')">Organic</button>
            <button class="btn-class" onclick="sendClassCommand('other')">Other</button>
            <button class="btn-class" onclick="sendClassCommand('plastic')">Plastic</button>
        </div>
    </div>

    <div class="section">
        <h2>Legacy controls</h2>
        <div class="btn-container">
            <button class="btn-show" onclick="sendDisplayCommand(true)">Display Sample</button>
            <button class="btn-hide" onclick="sendDisplayCommand(false)">Revert to Logo</button>
        </div>
    </div>

    <div id="status">Status: Ready</div>

    <script>
        async function sendDisplayCommand(showState) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Sending request over ROS 2...";
            try {
                const response = await fetch('/api/set_display', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ state: showState })
                });
                const data = await response.json();
                statusDiv.innerText = `Result: ${data.message}`;
            } catch (err) {
                statusDiv.innerText = `Error connecting to web bridge`;
            }
        }

        async function sendClassCommand(category) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = `Requesting '${category}' image...`;
            try {
                const response = await fetch('/api/set_display_class', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category: category })
                });
                const data = await response.json();
                statusDiv.innerText = `Result: ${data.message}`;
            } catch (err) {
                statusDiv.innerText = `Error connecting to web bridge`;
            }
        }
    </script>
</body>
</html>
