<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics Dojo - Team Map Upload</title>
    <link rel="stylesheet" href="/static/team.css">
</head>
<body>
    <header><h1>ROBOTICS DOJO</h1><p>Team map upload</p></header>
    <main>
        <section>
            <label>Team name <input id="team" type="text" maxlength="32" placeholder="e.g. Alpha"></label>
            <label id="token-row" hidden>Token <input id="token" type="password" placeholder="given by the judges"></label>
        </section>

        <section>
            <h2>Judges' request</h2>
            <div id="pending" class="pending none">Checking...</div>
        </section>

        <section>
            <h2>Send a file</h2>
            <p class="hint">An RViz screenshot (.png / .jpg) or a map (.pgm).</p>
            <input id="file" type="file" accept=".pgm,.png,.jpg,.jpeg,image/png,image/jpeg">
            <img id="preview" alt="" hidden>
            <button id="send" disabled>Send to judges</button>
            <div id="result"></div>
        </section>

        <section>
            <h2>Or use the terminal (Ubuntu 24.04, Pi or PC)</h2>
            <p class="hint">Sends the map straight from ROS. Source ROS first for PGM capture.</p>
            <pre id="cmd"></pre>
            <button id="copy">Copy commands</button>
        </section>
    </main>
    <script src="/static/team.js"></script>
</body>
</html>
